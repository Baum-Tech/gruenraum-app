<style>
:root{
  --green:#2f6b1f; --green-d:#234f17; --green-l:#e2efd9; --green-m:#9bbb8a;
  --bg:#f4f6f2; --card:#ffffff; --ink:#1d2419; --muted:#5f6b58; --line:#d5ddcf;
  --warn:#fff3b0; --red:#b3261e; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top img{width:34px;height:34px;background:#fff;border-radius:50%;padding:3px}
header.top .tt{flex:1;min-width:0}
header.top .t1{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t2{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;min-width:42px;height:42px;font-size:20px;cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px 0;font-size:13.5px;color:var(--muted)}
.crumbs a{color:var(--green);text-decoration:none}
main{max-width:980px;margin:0 auto;padding:12px 16px 120px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;cursor:pointer}
.item:active{background:var(--green-l)}
.item .ic{width:40px;height:40px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:20px;flex:none}
.item .b{flex:1;min-width:0}
.item .n{font-weight:600}
.item .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ch{color:var(--muted);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left}
.tile:active{background:var(--green-l)}
.tile .g{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .n{font-weight:650;margin:3px 0}
.tile .f{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:0 16px;min-height:44px;background:var(--green);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--card);color:var(--green);border:1px solid var(--green-m)}
.btn.del{background:var(--card);color:var(--red);border:1px solid #e3b7b4}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;border-radius:28px;min-height:54px;padding:0 22px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.note{background:#fffbe6;border:1px solid #efe1a0;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.hint{font-size:13px;color:var(--muted)}
/* simple form (Stammdaten) */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fgrid .full{grid-column:1/-1}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;min-height:44px;color:var(--ink)}
textarea.inp{min-height:70px;resize:vertical}
/* Vorlagen-Optik */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:Arial,Helvetica,sans-serif}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:12px}
.paper .ph .h{font-size:20px;font-weight:700;color:var(--green-d)}
.paper .ph .sub{font-size:13px;color:var(--muted)}
.paper .ph img{width:56px;height:56px}
.sec-t{font-weight:700;color:var(--green-d);margin:18px 0 6px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.sec-t .no{background:var(--green);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px}
table.vt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14.5px}
table.vt th,table.vt td{border:1px solid var(--green-m);vertical-align:top;padding:0}
table.vt th{background:var(--green-l);text-align:left;font-weight:600;padding:8px;width:24%;font-size:13.5px}
table.vt td input,table.vt td select,table.vt td textarea{width:100%;border:0;background:transparent;padding:8px;min-height:40px;border-radius:0;display:block}
table.vt td textarea{min-height:64px;resize:vertical}
table.vt td input:focus,table.vt td select:focus,table.vt td textarea:focus{outline:2px solid var(--green);outline-offset:-2px;background:#fbfff8}
table.vt td.pre input,table.vt td.pre textarea{background:#f6faf3}
.meas{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.meas label{display:flex;align-items:center;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:12.5px;color:var(--muted);padding-left:6px}
.meas label input{min-height:38px}
.rep{border:1px solid var(--green-m);border-radius:8px;margin:10px 0;overflow:hidden}
.rep>.rh{display:flex;align-items:center;justify-content:space-between;background:var(--green);color:#fff;padding:6px 10px;font-weight:600;font-size:14px}
.rep>.rh button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;min-height:32px;padding:0 10px;cursor:pointer}
.rep table.vt th:first-child,.rep table.vt td:first-child{border-left:0}
.photos{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
.ph-i{width:132px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafafa;position:relative}
.ph-i img{width:100%;height:96px;object-fit:cover;display:block}
.ph-i input{font-size:12.5px!important;min-height:32px!important;padding:5px!important;border-top:1px solid var(--line)!important}
.ph-i .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.ph-add{width:132px;min-height:128px;border:2px dashed var(--green-m);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--green);cursor:pointer;font-size:13px;gap:4px;background:#fbfdf9}
.ph-add span{font-size:26px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ttable{overflow-x:auto;border:1px solid var(--green-m);border-radius:6px}
.ttable table{border-collapse:collapse;font-size:13px;min-width:900px;width:100%}
.ttable th,.ttable td{border:1px solid var(--green-m);padding:6px;vertical-align:top;text-align:left}
.ttable thead th{background:var(--green-l)}
.ttable thead tr:first-child th{background:#cfe3c2;text-align:center}
.ttable tbody tr{cursor:pointer}
.ttable tbody tr:hover{background:#f6faf3}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
.chip{border:1px solid var(--green-m);border-radius:20px;padding:8px 14px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.tree-mini{margin:10px 0}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#233;color:#fff;padding:8px 14px;border-radius:20px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}
.saved.on{opacity:.92}
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:calc(100% - 32px)}
dialog .dh{background:var(--green);color:#fff;padding:12px 16px;font-weight:700}
dialog .db{padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.badge{display:inline-block;font-size:11.5px;background:var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;color:#5a4a00;vertical-align:middle}
.proto{background:#fff3b0;color:#5a4a00;font-size:13px;padding:6px 16px;text-align:center}
@media (max-width:600px){
  table.vt.r, table.vt.r tbody, table.vt.r tr, table.vt.r th, table.vt.r td{display:block;width:100%}
  table.vt.r tr{border-bottom:0}
  table.vt.r th{border-bottom:0;padding:6px 8px}
  .fgrid{grid-template-columns:1fr}
  .meas{grid-template-columns:repeat(2,1fr)}
  .sig{grid-template-columns:1fr}
  .paper{padding:14px 10px}
}
@media print{
  header.top,.crumbs,.fab,.row-btns,.proto,.ph-add,.ph-i .x,.rep>.rh button,.noprint{display:none!important}
  body{background:#fff} main{padding:0;max-width:none} .paper{border:0;box-shadow:none;padding:0}
  textarea{resize:none}
}
</style>

/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{setTimeout(res,1500);try{const r=indexedDB.open('gruenraum-vorort',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('photos')};
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  get(store,k){return new Promise(res=>{if(!DB.db){try{res(JSON.parse(localStorage.getItem(store+':'+k)))}catch(e){res(null)}return}
    const t=DB.db.transaction(store).objectStore(store).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)})},
  set(store,k,v){return new Promise(res=>{if(!DB.db){try{localStorage.setItem(store+':'+k,JSON.stringify(v))}catch(e){}res();return}
    const tx=DB.db.transaction(store,'readwrite');tx.objectStore(store).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()})},
  del(store,k){return new Promise(res=>{if(!DB.db){try{localStorage.removeItem(store+':'+k)}catch(e){}res();return}
    const tx=DB.db.transaction(store,'readwrite');tx.objectStore(store).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res()})},
  all(store){return new Promise(res=>{if(!DB.db){res({});return}const out={};const c=DB.db.transaction(store).objectStore(store).openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>res(out)})}
};

/* ---------- Helfer ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const client=id=>byId(S.clients,id), object=id=>byId(S.objects,id), doc=id=>byId(S.docs,id);
function ctxFor(o,tree){const c=client(o.clientId)||{};
  return {S:S.settings,today:today(),object:Object.assign({projekt:[o.auftragsnr,o.name].filter(Boolean).join(': ')},o),
   client:Object.assign({block:[c.name,c.abt,c.adresse].filter(Boolean).join('\n')},c),tree:tree||{}}}
function resolve(p,ctx){if(p==='today')return ctx.today;const [a,b]=p.split('.');return (ctx[a]&&ctx[a][b])||''}
function eachField(sections,fn){sections.forEach(s=>{(s.rows||[]).forEach(r=>r.forEach(fn))})}
function prefill(d,o,onlyTree){const t=TPL[d.tpl];const tree=d.data.baum?byId(o.trees,d.data.baum):null;const ctx=ctxFor(o,tree);
  eachField(t.sections,f=>{if(f.t==='photos'||f.t==='meas')return;
    if(onlyTree){if(f.pre&&f.pre.startsWith('tree.')){const v=resolve(f.pre,ctx);if(v!=='')d.data[f.k]=v}return}
    if(d.data[f.k]!==undefined)return; if(f.pre)d.data[f.k]=resolve(f.pre,ctx); else if(f.def)d.data[f.k]=f.def;});
  t.sections.forEach(s=>{if(s.rep&&!d.data[s.rep]){d.data[s.rep]=[];for(let i=0;i<(s.min||0);i++)d.data[s.rep].push({})}});}
function docTitle(d){const t=TPL[d.tpl];let s=t.name.split(' (')[0];const o=object(d.objectId);
  if(d.data&&d.data.baum&&o){const tr=byId(o.trees,d.data.baum);if(tr)s+=' · Baum '+tr.nr}
  return s}
function getP(obj,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],obj)}
function setP(obj,path,v){const ks=path.split('.');let a=obj;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=isNaN(ks[i+1])?{}:[];a=a[ks[i]]}a[ks[ks.length-1]]=v}

/* ---------- Feld-Renderer ---------- */
let CUR=null; // {kind:'doc'|'tree', target}
function input(f,val,path,ctxTrees){
  const a=`data-p="${esc(path)}"`;
  switch(f.t){
   case 'ta':return `<textarea ${a} rows="3">${esc(val)}</textarea>`;
   case 'date':return `<input type="date" ${a} value="${esc(val)}">`;
   case 'number':return `<input type="text" inputmode="decimal" ${a} value="${esc(val)}">`;
   case 'sel':{const opts=f.opts||L[f.list];return `<select ${a}>${opts.map(o=>`<option ${o===(val||'')?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
   case 'combo':return `<input type="text" list="dl-${f.list}" ${a} value="${esc(val)}" autocomplete="off">`;
   case 'treesel':return `<select ${a} data-treesel="1"><option value="">– Baum wählen –</option>${(ctxTrees||[]).map(t=>`<option value="${t.id}" ${t.id===val?'selected':''}>Baum ${esc(t.nr)} · ${esc(t.art)}</option>`).join('')}</select>`;
   case 'meas':{const v=val||[];return `<div class="meas">${[0,1,2,3,4,5,6,7].map(i=>`<label>M${i+1}<input type="text" inputmode="decimal" data-p="${esc(path)}.${i}" value="${esc(v[i]||'')}"></label>`).join('')}</div>`}
   case 'photos':{const v=val||[];return `<div class="photos">${v.map((p,i)=>`<div class="ph-i"><img src="${PHOTO[p.id]||''}" alt=""><button class="x" data-delphoto="${esc(path)}" data-i="${i}" aria-label="Foto löschen">✕</button><input type="text" placeholder="Bildunterschrift" data-p="${esc(path)}.${i}.cap" value="${esc(p.cap||'')}"></div>`).join('')}<div class="ph-add" data-addphoto="${esc(path)}"><span>📷</span>Foto aufnehmen / wählen</div></div>`}
   case 'gps':return `<div style="display:flex;gap:8px;align-items:center;padding:6px 8px"><input type="text" ${a} value="${esc(val)}" placeholder="Breite, Länge" style="flex:1;border:0"><button class="btn sm sec" data-gps="${esc(path)}">📍 Erfassen</button></div>`;
   default:return `<input type="text" ${a} value="${esc(val)}">`;
  }}
function rowsTable(rows,data,prefix,trees){
  return `<table class="vt r">${rows.map(r=>`<tr>${r.map((f,i)=>{const v=getP(data,f.k);const span=r.length===1?' colspan="3"':'';
    const wide=(f.t==='photos'||f.t==='meas');
    if(wide&&r.length===1)return `<th>${esc(f.l)}</th><td colspan="3">${input(f,v,prefix+f.k,trees)}</td>`;
    return `<th>${esc(f.l)}</th><td${span} class="${f.pre&&v?'pre':''}">${input(f,v,prefix+f.k,trees)}</td>`}).join('')}</tr>`).join('')}</table>`}
const datalists=()=>Object.keys(L).map(k=>`<datalist id="dl-${k}">${L[k].filter(Boolean).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`).join('');

const app=document.getElementById('app');
function head(t1,t2,crumbs){document.getElementById('t1').textContent=t1;document.getElementById('t2').textContent=t2||'';
  document.getElementById('crumbs').innerHTML=(crumbs||[]).map(([l,h])=>h?`<a href="${h}">${esc(l)}</a>`:`<span>${esc(l)}</span>`).join(' › ')}
function route(){const h=CURH.slice(2).split('/');CUR=null;window.scrollTo(0,0);
  if(h[0]==='c'&&client(h[1]))return pClient(client(h[1]));
  if(h[0]==='o'&&object(h[1]))return pObject(object(h[1]));
  if(h[0]==='d'&&doc(h[1]))return pDoc(doc(h[1]));
  if(h[0]==='t'&&object(h[1]))return pTree(object(h[1]),h[2]);
  if(h[0]==='s')return pSettings();
  pHome()}
let CURH=location.hash||'#/';
function go(h){CURH=h;try{history.pushState(null,'',h)}catch(e){}route()}
window.addEventListener('popstate',()=>{CURH=location.hash||'#/';route()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href'))}});

function editClient(c,isNew){dialog(isNew?'Neuer Auftraggeber':'Auftraggeber bearbeiten',`<div class="fgrid">

document.getElementById('fileIn').onchange=async e=>{const path=e.target.dataset.path;const tgt=CUR.kind==='doc'?CUR.target.data:CUR.target;
  let arr=getP(tgt,path);if(!Array.isArray(arr)){arr=[];setP(tgt,path,arr)}
  for(const f of e.target.files){const url=await shrink(f);const id=uid();PHOTO[id]=url;await DB.set('photos',id,url);arr.push({id,cap:''})}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.8))};img.onerror=()=>res(r.result);img.src=r.result};r.readAsDataURL(file)})}

const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const PKGR='http://schemas.openxmlformats.org/package/2006/relationships';
const CTNS='http://schemas.openxmlformats.org/package/2006/content-types';
const VORLAGE={kurz:'Kurzgutachten_NEU.dotx',kurzAlt:'Kurzgutachten.dotx',eu:'EU_Extern.dotx',bbbExt:'BBB_Protokoll_Extern.dotx',bbbInt:'BBB_Protokoll.dotx',
  aufnahme:'BBB_Aufnahme_Massnahmeempfehlungen.docx',gefahr:'Gefahrenbaum.dotx',erfassung:'Tabelle_Baumerfassung.xltx',eingriffe:'Tabelle_Eingriffe_Schutzmassnahmen.xltx'};

async function loadTpl(name){const r=await fetch('vorlagen/'+name);if(!r.ok)throw new Error('Vorlage '+name+' nicht gefunden');return JSZip.loadAsync(await r.arrayBuffer())}
const parseX=s=>new DOMParser().parseFromString(s,'application/xml');
const serX=d=>{let s=new XMLSerializer().serializeToString(d);if(!s.startsWith('<?xml'))s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s;return s};
const kidsOf=(n,name)=>[...n.childNodes].filter(c=>c.nodeType===1&&c.localName===name&&c.namespaceURI===WNS);
const allOf=(n,name)=>[...n.getElementsByTagNameNS(WNS,name)];
const pText=p=>allOf(p,'t').map(t=>t.textContent).join('');
const after=(ref,node)=>{ref.parentNode.insertBefore(node,ref.nextSibling);return node};
const before=(ref,node)=>{ref.parentNode.insertBefore(node,ref);return node};
const rm=n=>n&&n.parentNode&&n.parentNode.removeChild(n);
const fD=d=>d?d.split('-').reverse().join('.'):'';

class Docx{
  constructor(zip){this.zip=zip;this.n=0}
  async open(){this.doc=parseX(await this.zip.file('word/document.xml').async('string'));this.rels=parseX(await this.zip.file('word/_rels/document.xml.rels').async('string'));
    this.ct=parseX(await this.zip.file('[Content_Types].xml').async('string'));this.body=allOf(this.doc,'body')[0];return this}
  w(name){return this.doc.createElementNS(WNS,'w:'+name)}
  paras(){return kidsOf(this.body,'p')}
  findBodyP(pred){for(const p of kidsOf(this.body,'p'))if(pred(pText(p).trim(),p))return p;return null}
  freeSpacing(p){const ppr=kidsOf(p,'pPr')[0];const sp=ppr&&kidsOf(ppr,'spacing')[0];if(sp){sp.removeAttributeNS(WNS,'line');sp.removeAttributeNS(WNS,'lineRule');sp.removeAttribute('w:line');sp.removeAttribute('w:lineRule')}return p}
  async sigBefore(ref){const empty=n=>n&&n.nodeType===1&&n.localName==='p'&&!pText(n).trim()&&!allOf(n,'drawing').length;let e=ref.previousSibling;
    const r=await this.img(SIG,4.2,1.4);if(!r)return;if(empty(e)){this.freeSpacing(e);e.appendChild(r);let k=0,q=e.previousSibling;while(k<2&&empty(q)&&empty(q.previousSibling)){const nq=q.previousSibling;rm(q);q=nq;k++}}else{const p=this.blankP(ref);this.freeSpacing(p);p.appendChild(r);before(ref,p)}}
  findP(pred,from){const ps=allOf(this.body,'p');let st=from?ps.indexOf(from)+1:0;for(let i=st;i<ps.length;i++)if(pred(pText(ps[i]).trim(),ps[i]))return ps[i];return null}
  rPrOf(p,last){const rs=allOf(p,'r').filter(r=>allOf(r,'t').length);const r=last?rs[rs.length-1]:rs[0];let rp=r&&kidsOf(r,'rPr')[0];
    if(!rp){const ppr=kidsOf(p,'pPr')[0];rp=ppr&&kidsOf(ppr,'rPr')[0]}return rp?rp.cloneNode(true):null}
  clean(rp,noBold){if(!rp)return null;for(const k of ['highlight','vanish'])kidsOf(rp,k).forEach(rm);if(noBold)['b','bCs'].forEach(k=>kidsOf(rp,k).forEach(rm));return rp}
  runs(text,rp){const out=[];String(text??'').split('\n').forEach((line,li)=>{const r=this.w('r');if(rp)r.appendChild(rp.cloneNode(true));
      if(li>0)r.appendChild(this.w('br'));line.split('\t').forEach((seg,si)=>{if(si>0)r.appendChild(this.w('tab'));if(seg){const t=this.w('t');t.setAttribute('xml:space','preserve');t.textContent=seg;r.appendChild(t)}});out.push(r)});return out}
  setP(p,text,opt={}){const rp=this.clean(this.rPrOf(p),opt.noBold);[...p.childNodes].forEach(c=>{if(!(c.nodeType===1&&c.localName==='pPr'))rm(c)});this.runs(text,rp).forEach(r=>p.appendChild(r));return p}

  const block=rows.slice(5,10).map(r=>r.cloneNode(true));const foot=rows[19];rows.slice(5,19).forEach(rm);
  const items=(d.baeume||[]).length?d.baeume:[{}];
  items.forEach((it,i)=>{const rs=block.map(r=>r.cloneNode(true));if(i===items.length-1)rs.pop();rs.forEach(r=>tb.insertBefore(r,foot));
    const c=rs.map(r=>kidsOf(r,'tc')[0]);x.afterLabel(c[0],'Objekt- und Standortnummer:',it.nr,'append');x.afterLabel(c[1],'Lage:',it.lage,'append');
    x.afterLabel(c[2],'Beschreibung Schadsymptome:',it.symptome);x.afterLabel(c[3],'Maßnahmenempfehlung:',it.massnahme)});
  const fc=kidsOf(foot,'tc')[0];const ap=kidsOf(fc,'p').find(p=>pText(p).startsWith('Aufgestellt'));
  if(ap){x.replace(ap,'NAME BAUMGUTACHTER',d.u_name||S.settings.name);x.replace(ap,'XX.XX.2026',fD(d.u_datum));const sp=x.freeSpacing(x.blankP(ap));const r=await x.img(SIG,4,1.4);if(r){sp.appendChild(r);after(ap,sp)}}
  const mp=kidsOf(fc,'p').find(p=>pText(p).trim()==='Mailadresse');if(mp)x.setP(mp,d.u_mail||S.settings.email);
  return x}
};

const XCOLS={erfassung:{B:'nr',C:'art',D:'hoehe',E:'kroned',F:'stammd',G:'vit',H:'funktion',I:'krone',J:'stamm',K:'stammfuss',L:'wurzel',M:'bem'},
             eingriffe:{B:'nr',C:'art',D:'eKrone',E:'eStamm',F:'eFuss',G:'eWurzel',H:'bem',I:'schutz'}};
async function exportXlsx(tpl,o){const zip=await loadTpl(VORLAGE[tpl]);const SN='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const sx=parseX(await zip.file('xl/worksheets/sheet1.xml').async('string'));const sd=sx.getElementsByTagNameNS(SN,'sheetData')[0];
  const rowEls=()=>[...sd.getElementsByTagNameNS(SN,'row')];const byR=r=>rowEls().find(e=>e.getAttribute('r')==String(r));
  const cols=XCOLS[tpl];
  o.trees.forEach((t,i)=>{const r=3+i;let row=byR(r);
    if(!row){const last=rowEls().pop();row=last.cloneNode(true);row.setAttribute('r',r);[...row.getElementsByTagNameNS(SN,'c')].forEach(c=>{const col=c.getAttribute('r').replace(/\d+/g,'');c.setAttribute('r',col+r);
        if(col==='A'){[...c.childNodes].forEach(rm);const v=sx.createElementNS(SN,'v');v.textContent=i+1;c.appendChild(v)}else{c.removeAttribute('t');[...c.childNodes].forEach(rm)}});sd.appendChild(row)}
    row.removeAttribute('ht');row.removeAttribute('customHeight');
    for(const [col,key] of Object.entries(cols)){const val=t[key];if(val==null||val==='')continue;let c=[...row.getElementsByTagNameNS(SN,'c')].find(c=>c.getAttribute('r')===col+r);
      if(!c){c=sx.createElementNS(SN,'c');c.setAttribute('r',col+r);const nxt=[...row.getElementsByTagNameNS(SN,'c')].find(e=>e.getAttribute('r').replace(/\d+/g,'')>col&&e.getAttribute('r').replace(/\d+/g,'').length===1);row.insertBefore(c,nxt||null)}
      [...c.childNodes].forEach(rm);const num=/^-?\d+([.,]\d+)?$/.test(String(val).trim());
      if(num){c.removeAttribute('t');const v=sx.createElementNS(SN,'v');v.textContent=String(val).trim().replace(',','.');c.appendChild(v)}
      else{c.setAttribute('t','inlineStr');const is=sx.createElementNS(SN,'is'),tt=sx.createElementNS(SN,'t');tt.setAttribute('xml:space','preserve');tt.textContent=String(val);is.appendChild(tt);c.appendChild(is)}}});
  const dim=sx.getElementsByTagNameNS(SN,'dimension')[0];if(dim)dim.setAttribute('ref',dim.getAttribute('ref').replace(/\d+$/,Math.max(37,2+o.trees.length)));
  zip.file('xl/worksheets/sheet1.xml',serX(sx));
  let ct=await zip.file('[Content_Types].xml').async('string');zip.file('[Content_Types].xml',ct.replace('spreadsheetml.template.main+xml','spreadsheetml.sheet.main+xml'));
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'})}

const safe=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,50);
const SHORT={kurz:'Kurzgutachten',eu:'Gutachten_EU',bbb:'Protokoll_BBB',aufnahme:'BBB_Aufnahme',gefahr:'Gefahrenbaum',erfassung:'Baumerfassung',eingriffe:'Eingriffe_Schutzmassnahmen'};
async function runExport(d){const o=object(d.objectId),t=TPL[d.tpl];dialog('Datei wird erstellt …','<p>Die Vorlage wird befüllt. Einen Moment bitte.</p>');
  try{let blob,ext;
    if(t.table){blob=await exportXlsx(d.tpl,o);ext='xlsx'}else{const x=await FILL[d.tpl](d.data,o);blob=await x.blob();ext='docx'}
    const tr=d.data&&d.data.baum?byId(o.trees,d.data.baum):null;
    const name=`${today()}_${SHORT[d.tpl]}_${safe(o.name)}${tr?'_Baum'+safe(tr.nr):''}.${ext}`;deliver(blob,name)}
  catch(err){console.error(err);dialog('Export fehlgeschlagen',`<p>${esc(err.message||err)}</p><p class="hint">Ohne Internet funktioniert der Export nur, wenn die App vorher einmal online geöffnet wurde.</p><div class="row-btns"><button class="btn" id="cancel">OK</button></div>`)}}
function deliver(blob,name){const file=new File([blob],name,{type:blob.type});const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  dialog('Datei fertig',`<p><b>${esc(name)}</b><br><span class="hint">${(blob.size/1024/1024).toFixed(1)} MB</span></p><div class="row-btns">${canShare?'<button class="btn" id="shr">Teilen (Mail, WhatsApp …)</button>':''}<button class="btn ${canShare?'sec':''}" id="dl">Herunterladen</button><button class="btn sec" id="cancel">Schließen</button></div>`,()=>{
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)};
    if(canShare)$('#shr').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{})})}
